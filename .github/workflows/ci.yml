name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check localizations
        run: python3 scripts/check-localizations.py

      - name: Test
        run: swift test

      - name: Build app bundle
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar
          path: dist/*.zip
          retention-days: 7
