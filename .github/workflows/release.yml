name: Release

# `git tag v1.0.0 && git push origin v1.0.0` 하면 유니버설 앱을 빌드해서 GitHub Release에 올립니다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check localizations
        run: python3 scripts/check-localizations.py

      - name: Test
        run: swift test

      - name: Build universal app
        run: |
          UNIVERSAL=1 \
          VERSION="${GITHUB_REF_NAME#v}" \
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}" \
          ./scripts/build-app.sh

      - name: Checksum
        run: |
          cd dist
          # 웹사이트 다운로드 버튼이 쓰는 고정 이름 (releases/latest/download/ClaudeUsageBar.zip)
          cp "ClaudeUsageBar-${GITHUB_REF_NAME#v}.zip" ClaudeUsageBar.zip
          shasum -a 256 *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
